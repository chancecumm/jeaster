<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Binding of Isaac</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #flash-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="flash-container"></div>

    <!-- Load Ruffle locally from your own repository -->
    <script src="ruffle.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                document.getElementById("flash-container").appendChild(player);
                player.load({ url: "game.swf" });
            } else {
                document.getElementById("flash-container").innerHTML = "<p style='color:white; text-align:center; padding-top:20px;'>Local ruffle.js failed to initialize.</p>";
            }
        });
    </script>

</body>
</html>
