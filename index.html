<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Binding of Isaac</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #flash-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- A clean container with NO plugin tags -->
    <div id="flash-container"></div>

    <!-- Load the official Ruffle emulator engine -->
    <script src="https://unpkg.com"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Check if Ruffle loaded correctly
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                
                const container = document.getElementById("flash-container");
                container.appendChild(player);

                // Safely load the game file without triggering browser plugin blockers
                player.load({
                    url: "game.swf"
                });
            } else {
                document.getElementById("flash-container").innerHTML = "<p style='color:white; text-align:center; padding-top:20px;'>Ruffle failed to load from the CDN. Please refresh.</p>";
            }
        });
    </script>

</body>
</html>
