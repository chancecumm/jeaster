<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Binding of Isaac</title>
    <style>
        /* Force the game to fill the entire browser window cleanly */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Black background to match the game */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #flash-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="flash-container">
        <!-- Embedded Ruffle Player loading your file directly -->
        <embed src="TheBindingofIsaac.swf" width="100%" height="100%"></embed>
    </div>

    <!-- Load the official Ruffle emulator engine -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

</body>
</html>
